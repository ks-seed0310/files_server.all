<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOR-RD Studio</title>
    <!-- あなたの最強エンジンを外部から読み込み -->
    <script src="https://ks-seed0310.github.io/files_server.all/Source/Encryption1/Encryption_main.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 95%; max-width: 450px; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        .mode-group { display: flex; background: #eee; padding: 5px; border-radius: 10px; margin-bottom: 20px; }
        .mode-group label { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 8px; }
        .mode-group input { display: none; }
        .mode-group input:checked + span { background: white; display: block; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; padding: 5px 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #666; }
        input[type="file"], textarea { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
        textarea { height: 80px; resize: none; font-family: monospace; }
        .btn-exec { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #resultBox { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px; display: none; border: 1px solid #cce5ff; }
        .key-display { width: 100%; height: 60px; font-size: 0.75rem; margin-top: 10px; background: #fff; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="card">
    <h2>XOR-RD Studio</h2>
    
    <div class="mode-group">
        <label><input type="radio" name="mode" id="encMode" value="encode" checked onchange="toggleUI()"><span>暗号化</span></label>
        <label><input type="radio" name="mode" id="decMode" value="decode" onchange="toggleUI()"><span>復号</span></label>
    </div>

    <div class="input-group">
        <label>ファイルを選択:</label>
        <input type="file" id="fileInput">
    </div>

    <div class="input-group">
        <label id="keyLabel">秘密鍵の登録 (改行区切り):</label>
        <textarea id="keyInput" placeholder="ひらがなパスワード1&#10;MyPassword2"></textarea>
    </div>

    <button class="btn-exec" onclick="run()">実行 & ダウンロード</button>

    <div id="resultBox">
        <label>生成された解除キー (keyAllBase64):</label>
        <textarea id="outputKey" class="key-display" readonly></textarea>
        <div style="font-size:0.7rem; color:#666; margin-top:5px;">※鍵ファイル(.txt)も先にダウンロードされました</div>
    </div>
</div>

<script>
// UI切り替え
function toggleUI() {
    const isEnc = document.getElementById('encMode').checked;
    document.getElementById('keyLabel').innerText = isEnc ? "秘密鍵の登録 (改行区切り):" : "解除キー (keyAllBase64) を入力:";
    document.getElementById('keyInput').placeholder = isEnc ? "ひらがなパスワード1\nMyPassword2" : "Base64_Base64...";
    document.getElementById('resultBox').style.display = "none";
}

async function run() {
    const fileInput = document.getElementById('fileInput');
    const keyInput = document.getElementById('keyInput');
    const isEnc = document.getElementById('encMode').checked;

    // ファイルチェック
    if (fileInput.files.length === 0) return alert("ファイルを選択してください！");
    const file = fileInput.files[0];

    // 鍵チェック
    const rawKeyText = keyInput.value.trim();
    if (!rawKeyText) return alert("鍵を入力してください！");

    try {
        const arrayBuffer = await file.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);

        let keyParam;
        if (isEnc) {
            // 【暗号化時】各行の「生」の入力を確実にTextEncoderでバイナリ化し、即座にBase64文字列に変換
            keyParam = rawKeyText.split('\n').filter(s => s).map(s => {
                // 最新の toBase64() メソッドを使用
                return new TextEncoder().encode(s).toBase64();
            });
        } else {
            // 【復号時】生成済みの keyAllBase64 をそのまま渡す
            keyParam = rawKeyText;
        }

        // --- 外部JS Encryption_main.js の関数を呼び出し ---
        const res = xorRdUint8(data, 8, 1, keyParam);

        // 1. 先に鍵ファイルをダウンロード (暗号化時のみ)
        if (isEnc) {
            const keyInfo = `Original File: ${file.name}\nMaster Key (keyAllBase64):\n${res.keyAllBase64}`;
            const kLink = document.createElement("a");
            kLink.href = URL.createObjectURL(new Blob([keyInfo], { type: "text/plain" }));
            kLink.download = file.name + "_key.txt";
            kLink.click();

            document.getElementById('resultBox').style.display = "block";
            document.getElementById('outputKey').value = res.keyAllBase64;
        }

        // 2. 本体ファイルをダウンロード (拡張子キープ仕様)
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([res.result], { type: "application/octet-stream" }));
        a.download = isEnc ? file.name + ".bin" : file.name.replace(/\.bin$/i, "");
        
        // 連続DL回避の遅延
        setTimeout(() => {
            a.click();
            URL.revokeObjectURL(a.href);
        }, 150);

    } catch (e) {
        console.error(e);
        alert("エラーが発生しました。コンソールまたは鍵の形式を確認してください。");
    }
}
</script>
</body>
</html>
